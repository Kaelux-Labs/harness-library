name: Publish library
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
concurrency:
  group: library-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python scripts/catalog.py validate
      - run: python -m unittest discover -s tests -v
      - name: Verify badges on reviewed main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/catalog.py refresh
      - name: Persist boost receipts
        run: |
          if ! git diff --quiet -- data/boosts.json; then
            git config user.name "harness-library-bot"
            git config user.email "harness-library-bot@users.noreply.github.com"
            git add data/boosts.json
            git commit -m "Refresh verified community badge receipts"
            git push
          fi
      - run: python scripts/catalog.py build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.event.head_commit.message != 'Refresh verified community badge receipts'
      - name: Notify participating search engines of published changes
        if: github.event_name == 'push' && github.event.head_commit.message != 'Refresh verified community badge receipts'
        continue-on-error: true
        run: |
          python scripts/catalog.py build
          python scripts/notify_indexnow.py
